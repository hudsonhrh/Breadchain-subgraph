type BreadToken @entity {
  id: ID!
  name: String
  symbol: String
  totalSupply: BigInt!
  totalMinted: BigInt!
  totalBurned: BigInt!
  totalYieldClaimed: BigInt!
  totalDelegatedVotes: BigInt!
  yieldClaimer: Bytes
}


type User @entity {
  id: ID!
  balance: BigInt!
  totalReceived: BigInt!
  totalSent: BigInt!
  totalMinted: BigInt!
  totalBurned: BigInt!
  totalYieldClaimed: BigInt!
  votesDelegated: BigInt!
  delegatesTo: String
  transactionCount: Int!
  transfersSent: [TransferEvent!]! @derivedFrom(field: "from")
  transfersReceived: [TransferEvent!]! @derivedFrom(field: "to")
  mintEvents: [MintEvent!]! @derivedFrom(field: "receiver")
  burnEvents: [BurnEvent!]! @derivedFrom(field: "receiver")
  yieldClaimedEvents: [ClaimedYieldEvent!]! @derivedFrom(field: "receiver")
  delegationEvents: [DelegationEvent!]! @derivedFrom(field: "delegator")
  votes: BigInt!
  lastVotedBlock: BigInt!
  distributions: [BigInt!]!
  voteEvents: [VoteEvent!]! @derivedFrom(field: "voter")
}


type TransferEvent @entity {
  id: ID!
  from: User
  to: User
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
  token: BreadToken!
}

type MintEvent @entity {
  id: ID!
  receiver: User!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type BurnEvent @entity {
  id: ID!
  receiver: User!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type ClaimedYieldEvent @entity {
  id: ID!
  receiver: User!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type DelegationEvent @entity {
  id: ID!
  delegator: User!
  delegatee: User!
  previousDelegatee: User!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type YieldDistributor @entity {
  id: ID!
  totalYieldDistributed: BigInt!
  totalVotes: BigInt!
  distributions: [YieldDistributionEvent!]! @derivedFrom(field: "yieldDistributor")
  voteEvents: [VoteEvent!]! @derivedFrom(field: "yieldDistributor")
  projects: [Project!]!
}

type Project @entity {
  id: ID!
  address: Bytes!
  totalReceivedYield: BigInt!
  distributions: [ProjectDistribution!]! @derivedFrom(field: "project")
}

type ProjectDistribution @entity {
  id: ID!
  project: Project!
  yieldDistributionEvent: YieldDistributionEvent!
  amount: BigInt!
}

type YieldDistributionEvent @entity {
  id: ID!
  yieldDistributor: YieldDistributor!
  totalYield: BigInt!
  totalVotes: BigInt!
  projectDistributions: [ProjectDistribution!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type VoteEvent @entity {
  id: ID!
  voter: User!
  yieldDistributor: YieldDistributor!
  points: [BigInt!]!
  projects: [Project!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type ProjectAddedEvent @entity {
  id: ID!
  project: Project!
  yieldDistributor: YieldDistributor!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type ProjectRemovedEvent @entity {
  id: ID!
  project: Project!
  yieldDistributor: YieldDistributor!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}


