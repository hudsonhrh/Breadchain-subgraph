type BreadToken @entity {
  id: ID!
  name: String
  symbol: String
  totalSupply: BigInt!
  totalMinted: BigInt!
  totalBurned: BigInt!
  totalYieldClaimed: BigInt!
  totalDelegatedVotes: BigInt!
  yieldClaimer: Bytes
}

type User @entity {
  id: ID!
  balance: BigInt!
  totalReceived: BigInt!
  totalSent: BigInt!
  totalMinted: BigInt!
  totalBurned: BigInt!
  totalYieldClaimed: BigInt!
  votesDelegated: BigInt!
  delegatesTo: String
  transactionCount: Int!
  transfersSent: [TransferEvent!]! @derivedFrom(field: "from")
  transfersReceived: [TransferEvent!]! @derivedFrom(field: "to")
  mintEvents: [MintEvent!]! @derivedFrom(field: "receiver")
  burnEvents: [BurnEvent!]! @derivedFrom(field: "receiver")
  yieldClaimedEvents: [ClaimedYieldEvent!]! @derivedFrom(field: "receiver")
  delegationEvents: [DelegationEvent!]! @derivedFrom(field: "delegator")
  votes: BigInt!
  lastVotedBlock: BigInt!
  distributions: [BigInt!]!
  voteEvents: [VoteEvent!]! @derivedFrom(field: "voter")
}


type TransferEvent @entity {
  id: ID!
  from: User
  to: User
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  logIndex: BigInt!
  token: BreadToken!
}

type MintEvent @entity {
  id: ID!
  receiver: User!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type BurnEvent @entity {
  id: ID!
  receiver: User!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type ClaimedYieldEvent @entity {
  id: ID!
  receiver: User!
  amount: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type DelegationEvent @entity {
  id: ID!
  delegator: User!
  delegatee: User!
  previousDelegatee: User!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
  token: BreadToken!
}

type YieldDistributionEvent @entity {
  id: ID!
  totalYield: BigInt!
  totalVotes: BigInt!
  projectDistributions: [BigInt!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

type VoteEvent @entity {
  id: ID!
  voter: Voter!
  points: [BigInt!]!
  projects: [Bytes!]!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

